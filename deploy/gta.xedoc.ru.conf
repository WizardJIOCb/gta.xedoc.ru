server {
    listen 80;
    server_name gta.xedoc.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://gta.xedoc.ru$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gta.xedoc.ru;
    ssl_certificate /etc/letsencrypt/live/gta.xedoc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gta.xedoc.ru/privkey.pem;

    root /var/www/gta.xedoc.ru/current;
    index index.html;
    add_header Cache-Control "no-cache";
    location / { try_files $uri $uri/ =404; }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
